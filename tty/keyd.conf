# Caps Lock: tap = Esc, hold = Ctrl, on every keyboard and in every desktop (keyd, system-wide).
# Installed to /etc/keyd/default.conf by tty/keys.sh. Nothing else is remapped: the rest of None's
# keys are plain Linux keys (tty/keys.json).
[ids]
*

[global]
# a tap held longer than this is a Ctrl press, not an Esc
overload_tap_timeout = 1000

[main]
capslock = overload(control, esc)
