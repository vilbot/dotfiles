# hypridle for None (started by tty/hyprland.lua, which sets $NONE_DIR; hyprlang syntax, hypridle
# doesn't read Lua).
# Before the system sleeps, None locks (hyprlock, only the password opens it: tty/lock), so
# waking up shows the lock. The screen turns off after 2 hours without use.

general {
    lock_cmd = $NONE_DIR/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 7200
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}
