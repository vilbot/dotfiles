# hypridle for None (started by tty/hyprland.lua; hyprlang syntax, hypridle doesn't read Lua).
# Before the system sleeps, None locks (only the password opens it: tty/shell/LockScreen.qml), so
# waking up shows the lock. The screen turns off after 2 hours without use, as on the full desktop.

general {
    lock_cmd = qs -p $HOME/dotfiles/tty/shell ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 7200
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}
