# None's lock (hyprlock; hyprlang syntax, hyprlock doesn't read Lua), started by tty/lock.
# Looks like None's terminal: the theme's background, Hack, the user and clock at the top left,
# the password line under them. Colours: $base00..$base0F of None's current theme, written by
# tty/theme.py.
source = ~/.local/state/none/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = $base00
}

# you@host, like the prompt
label {
    monitor =
    text = cmd[update:60000] echo "<b>$USER@$(cat /etc/hostname)</b>  locked"
    color = $base07
    font_family = Hack
    font_size = 16
    position = 10, -10
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $base04
    font_family = Hack
    font_size = 16
    position = -10, -10
    halign = right
    valign = top
}

input-field {
    monitor =
    size = 480, 40
    position = 10, -50
    halign = left
    valign = top
    rounding = 0
    outline_thickness = 0
    outer_color = $base00
    inner_color = $base00
    font_color = $base07
    font_family = Hack
    check_color = $base00
    fail_color = $base00
    capslock_color = $base00
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = false
    dots_text_format = *
    fade_on_empty = false
    placeholder_text = <span foreground="##$base04hex">password</span>
    fail_text = <span foreground="##$base08hex">Login incorrect</span>
    check_text = <span foreground="##$base04hex">checking…</span>
}
