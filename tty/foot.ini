# foot for the "None" desktop (tty/hyprland.lua), only used through tty/term (`foot -c`), so
# foot elsewhere is untouched. Colours: None's current theme (tty/theme.py writes it; tty/term
# makes sure it's there; gruver16 until one is picked). tty/foot-colors.ini is gruver16's, for the login screen (tty/login.sh).
include=~/.local/state/none/foot-colors.ini

[main]
font=Hack:size=12
line-height=19
pad=10x6
resize-by-cells=no
title=tty

[bell]
urgent=no
notify=yes
visual=no

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# Super+C/V (tty/actions.lua's universal clipboard) send Ctrl+Insert / Shift+Insert to every app:
# here they copy and paste the clipboard (Shift+Insert would be the selection's paste), and
# Ctrl+C stays the shell's interrupt.
[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
primary-paste=none
