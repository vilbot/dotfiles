# foot for the "None" desktop (tty/hyprland.lua), only used through tty/term (`foot -c`), so
# foot elsewhere is untouched. Same font as Ghostty (ghostty/config.ghostty); gruver16 colours
# from theme/build.py.
include=~/dotfiles/tty/foot-colors.ini

[main]
font=Hack:size=12
line-height=19
pad=10x6
resize-by-cells=no
title=tty

[bell]
urgent=no
notify=yes
visual=no

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
