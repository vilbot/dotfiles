# foot for the "None" desktop (tty/hyprland.lua), only used through tty/term (`foot -c`), so
# foot elsewhere is untouched. Same font as Ghostty (ghostty/config.ghostty). Colours: None's
# current theme (tty/theme.py writes it; tty/term makes sure it's there; gruver16 until one is
# picked). tty/foot-colors.ini is gruver16's, for the login screen (tty/login.sh).
include=~/.local/state/none/foot-colors.ini

[main]
font=Hack:size=12
line-height=19
pad=10x6
resize-by-cells=no
title=tty

[bell]
urgent=no
notify=yes
visual=no

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
