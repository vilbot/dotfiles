# foot as the console, for the "None" desktop (tty/hyprland.lua). Only used through `foot -c`,
# so foot elsewhere is untouched.
# The font is the console font itself, turned into pixels by tty/psf2ttf.py; pixelsize = its
# glyph height (32 for ter-v32n), so every console pixel is one screen pixel.

[main]
font=TTY Console:pixelsize=32
font-bold=TTY Console:pixelsize=32
font-italic=TTY Console:pixelsize=32
font-bold-italic=TTY Console:pixelsize=32
dpi-aware=no
pad=0x0
resize-by-cells=no
bold-text-in-bright=palette-based
title=tty
box-drawings-uses-font-glyphs=yes

[bell]
urgent=no
notify=no
visual=no

[cursor]
style=underline
blink=yes
underline-thickness=2

[mouse]
hide-when-typing=yes

[colors-dark]
# the Linux console's VGA palette
alpha=1.0
background=000000
foreground=aaaaaa
regular0=000000
regular1=aa0000
regular2=00aa00
regular3=aa5500
regular4=0000aa
regular5=aa00aa
regular6=00aaaa
regular7=aaaaaa
bright0=555555
bright1=ff5555
bright2=55ff55
bright3=ffff55
bright4=5555ff
bright5=ff55ff
bright6=55ffff
bright7=ffffff
selection-foreground=000000
selection-background=aaaaaa
