# hypridle (idle daemon), started from hyprland.lua. hyprlang syntax: hypridle doesn't read Lua.
# Only turns the screen off after 2 hours without use; any input turns it back on. No locking and
# no sleep. Apps that play video (or set an idle inhibitor) keep it from triggering.

listener {
    timeout = 7200
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}
