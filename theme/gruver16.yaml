# gruver16 — the ONE source of truth for colors across all apps.
# Edit here, then run:  python3 theme/build.py
#
# Roles (what each slot is used for, roughly):
#   base00 background        base08 red     / errors, deletions
#   base01 panels, statusbar  base09 purple  / numbers, constants
#   base02 selection          base0A sage    / types, classes  (ANSI "yellow" slot)
#   base03 borders, guides    base0B green   / strings, additions
#   base04 comments, muted    base0C teal    / constants, escapes
#   base05 dim text           base0D blue    / functions
#   base06 light text         base0E yellow  / keywords, shell commands (ANSI "magenta" slot)
#   base07 main foreground    base0F brown   / misc
